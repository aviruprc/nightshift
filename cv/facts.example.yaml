# How the bot searches and scores for you (all optional; see docs/CONFIGURING_FACTS.md).
preferences:
  # Locations you accept, as a regular expression matched against a posting's location (case-insensitive).
  home_location_regex: "bengaluru|bangalore|bangaluru|karnataka"
  # One paragraph the AI scorer and form-filler read about you (facts only; defaults to `summary`).
  candidate_profile: >
    4 years: Marketing Analyst at a retailer (campaign dashboards in Power BI, SQL segmentation, A/B test analysis) and Customer
    Insights Associate at a telecom (survey and churn analysis, Tableau). MSc Statistics. Bengaluru.
  # Roles you are eligible for (the scorer gives these 55+ unless a mandatory skill is missing).
  eligible_roles: >
    marketing / campaign / growth analyst, customer insights, data / BI / reporting / MIS analyst, business analyst, KYC / AML
    operations, operations analyst, survey and market research analyst, returnship programmes.
  # Fields you are NOT eligible for (scored below 35).
  unrelated_fields: "engineering, medicine, sales, HR, design, software development"
  # Skip jobs whose stated minimum experience is this many years or more (0 = no cap).
  max_stated_min_years: 5
  # Mandatory licences/qualifications you do not hold (named to the scorer).
  missing_qualifications: "CA, CFA charter, law degree"
  # Optional: Python level to state when a form asks (only if true for you). Leave empty to state nothing.
  python_level: "basic exposure only (Beginner / less than 1 year)"
  # Languages you speak (used for language rows on forms; proficiency levels are never invented).
  languages: [English, Tamil]

# Startup outreach emails (apply/outreach.py) - optional. {company} is replaced by the company name.
outreach:
  subject: "Application: Marketing / Data Analyst - Asha Example (4 years, SQL, Power BI, Tableau)"
  pitch: >
    I am a Marketing Analyst with 4 years of experience, most recently at Example Retail Co, where I built Power BI campaign
    dashboards, segmented customers with SQL and analysed A/B tests. My tools are SQL, Power BI, Tableau, Excel and Google
    Analytics, and I hold an MSc in Statistics.
  ask: "marketing analyst, customer insights or BI"
