<!doctype html><meta charset=utf-8><title>Apply - Data Analyst</title>
<form id=f onsubmit="event.preventDefault();document.body.innerHTML='<h1>Thank you for applying</h1>'">
 <label for=fn>First name *</label><input id=fn required>
 <label for=ln>Last name *</label><input id=ln required>
 <label for=em>Email *</label><input id=em type=email required>
 <label for=ph>Phone *</label><input id=ph type=tel required>
 <label for=np>Notice period *</label><select id=np required><option value="">Select</option><option>Immediate</option><option>30 days</option></select>
 <label for=cv>Resume *</label><input id=cv type=file required>
 <fieldset><legend>Are you legally authorized to work in India? *</legend>
  <label><input type=radio name=wa value=y required> Yes</label><label><input type=radio name=wa value=n> No</label></fieldset>
 <label><input type=checkbox id=t required> I agree to the terms and privacy policy</label>
 <label><input type=checkbox id=m> Send me marketing emails and job alerts</label>
 <button type=submit>Submit application</button></form>
