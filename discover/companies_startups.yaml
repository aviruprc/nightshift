# Bengaluru-based or Bengaluru-hiring product companies (SaaS, fintech, edtech, healthtech, e-commerce, data/analytics).
# companies: each entry was confirmed by a live curl to the ATS API returning job data on 2026-11-03.
#   Greenhouse: https://boards-api.greenhouse.io/v1/boards/{slug}/jobs
#   Lever:      https://api.lever.co/v0/postings/{slug}?mode=json
#   Ashby:      https://api.ashbyhq.com/posting-api/job-board/{slug}
#   SmartRecruiters: https://api.smartrecruiters.com/v1/companies/{slug}/postings?limit=1  (totalFound > 0)
#   Workday:    POST https://{host}/wday/cxs/{tenant}/{site}/jobs
# unsupported: careers page responded HTTP 200, but no supported ATS board was found in its HTML and no API
#   was verified. The ats value is "custom" for these. Several sites render jobs with JavaScript, so a real
#   board may exist that this check did not detect.
# tier: startup = venture-funded or early/growth stage; midsize = established or listed company.
